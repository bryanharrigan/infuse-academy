version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Use Node 20 to match Remix 2.10 expectations.
        - nvm use 20 || nvm install 20
        - node -v
        - npm ci
    build:
      commands:
        # Build Remix (produces build/client and build/server).
        - npm run build

        # ── Reshape into Amplify Hosting's deployment specification ──
        # Amplify's SSR runtime expects a very specific directory layout:
        #   .amplify-hosting/
        #     ├─ deploy-manifest.json       (tells Amplify how to route)
        #     ├─ static/                    (public, served by CDN)
        #     └─ compute/default/           (Node entrypoint + its deps)
        #         ├─ server.js              (starts Express + Remix)
        #         ├─ server/index.js        (the Remix SSR bundle)
        #         ├─ package.json
        #         └─ node_modules/          (production-only)
        - mkdir -p .amplify-hosting/compute/default

        # Copy static assets: Remix's build/client/ contents + anything in public/
        - cp -r build/client .amplify-hosting/static
        - if [ -d public ]; then cp -r public/. .amplify-hosting/static/; fi

        # Copy the Remix server bundle into the compute dir, preserving the
        # `server/index.js` path that our server.js imports.
        - mkdir -p .amplify-hosting/compute/default/server
        - cp -r build/server/. .amplify-hosting/compute/default/server/

        # Entrypoint + package metadata
        - cp server.js .amplify-hosting/compute/default/server.js
        - cp package.json .amplify-hosting/compute/default/package.json
        - cp package-lock.json .amplify-hosting/compute/default/package-lock.json

        # Production-only node_modules inside the compute bundle
        - cd .amplify-hosting/compute/default && npm ci --omit=dev && cd ../../..

        # Top-level manifest
        - cp deploy-manifest.json .amplify-hosting/deploy-manifest.json

        # ── Bake env vars into the compute bundle ──────────────────────
        # Amplify Hosting console env vars are exposed to the BUILD phase
        # as bash $VAR but are NOT automatically propagated to the SSR
        # compute Lambda's runtime environment. Write them to a .env file
        # inside the compute bundle so server.js can load them via dotenv
        # at startup. This is the documented workaround for SSR apps that
        # use a custom deploy-manifest.json layout.
        # Secrets: this .env lives only in the deployment artifact (not
        # source control); access is gated by the same IAM that protects
        # the Amplify app.
        - |
          cat > .amplify-hosting/compute/default/.env <<EOF
          COOKIE_SECRET=${COOKIE_SECRET}
          INFUSE_API_KEY=${INFUSE_API_KEY}
          INFUSE_API_URL=${INFUSE_API_URL}
          INFUSE_BASE_URL=${INFUSE_BASE_URL}
          INFUSE_PORTAL_URL=${INFUSE_PORTAL_URL}
          INFUSE_OAUTH_CLIENT_ID=${INFUSE_OAUTH_CLIENT_ID}
          INFUSE_OAUTH_CLIENT_SECRET=${INFUSE_OAUTH_CLIENT_SECRET}
          PUBLIC_URL=${PUBLIC_URL:-https://infuse.bryanharrigan.dev}
          EOF
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - ~/.npm/**/*
